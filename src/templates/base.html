<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/styles.css?v1.0">
    <title>{{ title }}</title>
</head>
<body>
    <header>
        <img class="brand-logo" src="/static/img/logo_white.png" alt="Databoard Logo">
        <h1>Datavana Databoard</h1>
        {% if taskcount is defined and taskcount is not none %}
        <div class="state">{{ taskcount }} tasks in the queue</div>
        {% endif %}
        <nav class="header-links" aria-label="Project links">
            <a href="https://github.com/datavana/databoard" target="_blank" rel="noopener noreferrer" title="GitHub">
                <img src="/static/img/github-white.svg" alt="GitHub">
            </a>
            <a href="https://datavana.github.io/databoard_r/" target="_blank" rel="noopener noreferrer" title="R package">
                <img src="/static/img/r-white.svg" alt="R">
            </a>
            <a href="https://databoard.uni-muenster.de/docs" target="_blank" rel="noopener noreferrer" title="API documentation">
                <img src="/static/img/api-white.svg" alt="API">
            </a>
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer>

    </footer>
</body>
</html>
